<svg xmlns="http://www.w3.org/2000/svg" width="980" height="260" viewBox="0 0 980 260">
  <rect width="980" height="260" fill="#f7fafc"/>
  <style>
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 12; ry: 12; }
    .txt { font-family: Segoe UI, Arial, sans-serif; fill: #111827; font-size: 16px; }
    .sub { font-family: Segoe UI, Arial, sans-serif; fill: #374151; font-size: 13px; }
    .arrow { stroke: #2563eb; stroke-width: 3; marker-end: url(#m); }
  </style>
  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect class="box" x="40" y="70" width="170" height="120"/>
  <text class="txt" x="70" y="112">CLI / API</text>
  <text class="sub" x="63" y="136">main.py, web.py</text>

  <rect class="box" x="260" y="70" width="180" height="120"/>
  <text class="txt" x="288" y="112">AWS Provider</text>
  <text class="sub" x="278" y="136">boto3 session, collect</text>

  <rect class="box" x="490" y="70" width="180" height="120"/>
  <text class="txt" x="520" y="112">Checks Engine</text>
  <text class="sub" x="525" y="136">S3 / IAM / EC2</text>

  <rect class="box" x="720" y="70" width="220" height="120"/>
  <text class="txt" x="750" y="112">Reports / Exports</text>
  <text class="sub" x="746" y="136">JSON, HTML, CSV, Trend</text>

  <line class="arrow" x1="210" y1="130" x2="260" y2="130"/>
  <line class="arrow" x1="440" y1="130" x2="490" y2="130"/>
  <line class="arrow" x1="670" y1="130" x2="720" y2="130"/>
</svg>
